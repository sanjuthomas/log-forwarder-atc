spring:
  application:
    name: log-forwarder-atc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:log_forwarder_atc}
    username: ${DB_USER:atc}
    password: ${DB_PASSWORD:atc}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

atc:
  polling:
    interval-ms: ${ATC_POLLING_INTERVAL_MS:30000}
    connect-timeout-ms: ${ATC_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ATC_READ_TIMEOUT_MS:5000}
  agent:
    health-path: /health
    ready-path: /ready
    metrics-path: /metrics
