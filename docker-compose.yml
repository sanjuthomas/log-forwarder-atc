services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: log-forwarder-atc-db
    environment:
      POSTGRES_DB: log_forwarder_atc
      POSTGRES_USER: atc
      POSTGRES_PASSWORD: atc
    ports:
      - "5432:5432"
    volumes:
      - atc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atc -d log_forwarder_atc"]
      interval: 5s
      timeout: 5s
      retries: 10

  atc:
    build: .
    container_name: log-forwarder-atc
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: log_forwarder_atc
      DB_USER: atc
      DB_PASSWORD: atc
      SERVER_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  atc-db-data:
